name: "Validate"

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install commitlint
        run: pnpm add --workspace-root --save-dev @commitlint/cli@19 @commitlint/config-conventional@19
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | pnpm exec commitlint --verbose

  lint:
    runs-on: "macos-15"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.CAP_GH_RELEASE_TOKEN || github.token }}

      - name: "Setup Tools"
        uses: ./.github/actions/setup-tools

      - uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: "main"

      - name: "Lint Packages"
        shell: bash
        run: |
          pnpm nx affected --target=lint
