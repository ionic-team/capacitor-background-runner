name: "Test"

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test-ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.CAP_GH_RELEASE_TOKEN || github.token }}
      - name: "Setup Tools"
        uses: ./.github/actions/setup-tools
      - run: sudo xcode-select --switch /Applications/Xcode_26.0.app
      - run: xcrun simctl list > /dev/null
      - run: xcodebuild -downloadPlatform iOS
      - name: List available Xcode versions
        run: ls /Applications | grep Xcode
      - uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: "main"
      - name: "Build Packages"
        shell: bash
        run: |
          pnpm nx affected --target=build
      - name: Run ios-engine unit tests
        run: |
          cd ./packages/capacitor-plugin
          pnpm run verify:ios

  unit-test-android:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.CAP_GH_RELEASE_TOKEN || github.token }}
      - name: "Setup Tools"
        uses: ./.github/actions/setup-tools
      - uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: "main"
      - name: "Build Packages"
        shell: bash
        run: |
          pnpm nx affected --target=build
      - name: "Running Android Unit Tests"
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          working-directory: ./packages/android-js-engine
          emulator-options: -no-window -no-audio -no-boot-anim -accel on -no-snapshot-save
          profile: pixel_6
          script: ./gradlew connectedCheck
